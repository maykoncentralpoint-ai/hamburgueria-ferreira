<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Hamburgueria Ferreira — Pedidos</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f2ef;color:#191919;font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:10;background:#111;color:#fff;border-bottom:1px solid #292929;padding:16px 18px 13px;box-shadow:0 2px 14px #0003}
.top{display:flex;align-items:center;gap:13px} .back{font-size:36px;line-height:1} h1{font-size:25px;font-weight:500;margin:0;flex:1}
.icon{font-size:24px}
main{max-width:680px;margin:auto;padding:14px 18px 125px}
.search{width:100%;padding:14px;border-radius:12px;border:1px solid #29343a;background:#11191d;color:white;font-size:15px;margin:4px 0 15px}
h2{font-size:20px;margin:22px 0 10px;color:#171717}
.card{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #182125;min-height:138px}
.card img{width:125px;height:125px;object-fit:cover;border-radius:12px;flex-shrink:0}
.details{flex:1;min-width:0;padding-top:3px} h3{margin:0 0 6px;font-size:17px;font-weight:700;color:#171717}
p{margin:0;color:#6f6f6f;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
strong{font-size:17px;font-weight:800;color:#171717} .row button{width:50px;height:46px;border:0;border-radius:10px;background:#151515;color:white;font-size:28px;box-shadow:0 2px 5px #0002}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#080d10;border-top:1px solid #202a2f;padding:11px 18px;z-index:20}
.checkout{width:100%;max-width:680px;display:block;margin:auto;border:0;border-radius:28px;background:#25d366;color:#07110a;padding:15px;font-size:17px;font-weight:700}
.badge{background:#07110a;color:#fff;border-radius:20px;padding:3px 8px;margin-left:5px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:flex-end}
.sheet{background:#10171b;border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow:auto;padding:20px}
.sheet-inner{max-width:650px;margin:auto} .sheet h2{margin-top:0}
label{display:block;font-size:13px;color:#aab0b4;margin:12px 0 6px}
input,select,textarea{width:100%;padding:13px;border:1px solid #303c42;border-radius:10px;background:#0b1114;color:#fff;font-size:15px}
textarea{min-height:70px;resize:vertical}
.order-list{background:#0b1114;border-radius:12px;padding:12px;margin:10px 0}
.order-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #1b2529;font-size:14px}
.order-line:last-child{border-bottom:0} .total{font-size:19px;font-weight:700;text-align:right;margin-top:10px}
.actions{display:flex;gap:10px;margin-top:15px} .actions button{flex:1;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700}
.cancel{background:#252f34;color:#fff} .send{background:#25d366;color:#07110a}
.empty{text-align:center;color:#8d969b;padding:20px}

.hero{background:#171717;color:#fff;border-radius:16px;padding:16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-title{font-size:18px;font-weight:800}.hero-sub{font-size:12px;color:#bdbdbd;margin-top:4px}.open{font-size:10px;font-weight:800;white-space:nowrap;color:#6ee58e}
""
.channel-header{background:#111;color:#fff;border-bottom:1px solid #292929;position:sticky;top:0;z-index:30}
.channel-banner{width:100%;height:210px;overflow:hidden;background:#080808;transition:height .25s ease}
.channel-banner img{width:100%;height:100%;object-fit:cover;display:block}
.channel-info{max-width:680px;margin:auto;display:flex;align-items:center;gap:14px;padding:0 18px;position:relative;min-height:92px;transition:min-height .25s ease}
.profile-placeholder{width:74px;height:74px;border-radius:50%;background:#171717;border:4px solid #111;display:flex;align-items:center;justify-content:center;font-size:35px;flex:0 0 74px;box-shadow:0 2px 8px #0007;transition:all .25s ease}
.channel-name{font-size:22px;font-weight:800;transition:font-size .25s ease}.channel-sub{font-size:13px;color:#aaa;margin-top:4px;transition:all .25s ease}
.channel-tabs{max-width:680px;margin:auto;display:flex;gap:28px;padding:0 18px}
.channel-tabs span{padding:13px 2px 12px;color:#aaa;font-size:12px;font-weight:800}
.channel-tabs .active{color:#fff;border-bottom:3px solid #e53935}
@media(max-width:520px){.channel-banner{height:175px}.channel-name{font-size:19px}.profile-placeholder{width:66px;height:66px;flex-basis:66px}.channel-tabs{gap:22px}}

.channel-header.compact .channel-banner{height:58px}
.channel-header.compact .channel-info{min-height:58px}
.channel-header.compact .profile-placeholder{width:48px;height:48px;flex-basis:48px;font-size:24px}
.channel-header.compact .channel-name{font-size:17px}
.channel-header.compact .channel-sub{font-size:11px;margin-top:1px}
</style>
</head>

<script>
const products = [{"name": "Ferreira tropical ✨", "price": 35.0}, {"name": "Cheddar Bacon 🥓", "price": 23.0}, {"name": "Premium especial 🍔🔥", "price": 38.0}, {"name": "Duplo smash 🍔", "price": 32.0}, {"name": "Banana prime 🍌", "price": 30.0}, {"name": "Duplo cheese", "price": 30.0},];
let cart = [];

function money(v) {
  return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}

function addItem(index) {
  const p = products[index];
  const existing = cart.find(x => x.name === p.name);
  if (existing) existing.qty++;
  else cart.push({name:p.name, price:p.price, qty:1});
  updateCount();
}

function updateCount() {
  document.getElementById('count').textContent = cart.reduce((s,x)=>s+x.qty,0);
}

function openOrder() {
  if (!cart.length) { alert('Seu pedido está vazio.'); return; }
  renderOrder();
  document.getElementById('modal').style.display='flex';
}

function closeOrder() { document.getElementById('modal').style.display='none'; }

function renderOrder() {
  const list=document.getElementById('orderList');
  list.innerHTML='';
  let total=0;
  cart.forEach((x,i)=>{
    total += x.price*x.qty;
    const div=document.createElement('div');
    div.className='order-line';
    div.innerHTML = `<span>${x.qty}x ${x.name}</span><span>${money(x.price*x.qty)}</span>`;
    list.appendChild(div);
  });
  document.getElementById('total').textContent='Total: '+money(total);
}

function deliveryFee(type) {
  if (type === 'Entrega — Central de Minas') return 3;
  if (type === 'Entrega — Floresta') return 5;
  return 0;
}

function isDelivery(type) {
  return type === 'Entrega — Central de Minas' || type === 'Entrega — Floresta';
}

function toggleDelivery() {
  const type=document.getElementById('deliveryType').value;
  document.getElementById('addressBox').style.display=isDelivery(type)?'block':'none';
}

function sendWhatsApp() {
  const customer=document.getElementById('customer').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const type=document.getElementById('deliveryType').value;
  const address=document.getElementById('address').value.trim();
  const complement=document.getElementById('complement').value.trim();
  const payment=document.getElementById('payment').value;
  const note=document.getElementById('note').value.trim();

  if(!customer) return alert('Digite seu nome.');
  if(!type) return alert('Escolha entrega ou retirada.');
  if(isDelivery(type) && !address) return alert('Digite o endereço para entrega.');
  if(!payment) return alert('Escolha a forma de pagamento.');

  let subtotal=0;
  let msg='🍔 *NOVO PEDIDO — HAMBURGUERIA FERREIRA*\n';
  msg+='━━━━━━━━━━━━━━━━━━━━\n';
  msg+='👤 *Cliente:* '+customer+'\n';
  if(phone) msg+='📱 *Telefone:* '+phone+'\n';
  msg+='📦 *Recebimento:* '+type+'\n';

  if(isDelivery(type)) {
    msg+='📍 *Endereço:* '+address+'\n';
    if(complement) msg+='🏠 *Complemento:* '+complement+'\n';
  }

  msg+='💳 *Pagamento:* '+payment+'\n';
  msg+='\n🛒 *ITENS DO PEDIDO*\n';

  cart.forEach(x=>{
    const sub=x.price*x.qty; subtotal+=sub;
    msg+='• '+x.qty+'x '+x.name+' — '+money(sub)+'\n';
  });

  const fee=deliveryFee(type);
  const total=subtotal+fee;
  msg+='\n💵 *Subtotal:* '+money(subtotal)+'\n';
  msg+='🛵 *Taxa de entrega:* '+money(fee)+'\n';
  msg+='💰 *TOTAL: '+money(total)+'*\n';
  if(note) msg+='📝 *Observação:* '+note+'\n';
  msg+='━━━━━━━━━━━━━━━━━━━━';

  const url='https://wa.me/5534999295692?text='+encodeURIComponent(msg);
  window.open(url,'_blank');
}

function filterCards(term) {
  term=term.toLowerCase();
  document.querySelectorAll('.product-card').forEach(c=>{
    c.style.display=c.dataset.name.includes(term)?'flex':'none';
  });
}
